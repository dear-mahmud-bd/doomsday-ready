openapi: 3.0.3
info:
  title: Doomsday Ready API
  version: 1.0.0
  description: API for MCU rewatch planning (topological sort) and opening-night seat booking (coin-change dynamic programming).
servers:
  - url: /api
    description: API base path
tags:
  - name: Health
    description: Health check endpoints
  - name: Movies
    description: MCU movies and rewatch ordering
  - name: Cinemas
    description: Cinemas and seat bundle quotes
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns ok status confirming backend service is running.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /movies:
    get:
      tags:
        - Movies
      summary: List all movies
      description: Returns an array of all movies along with their prerequisites.
      responses:
        "200":
          description: List of movies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movie'
    post:
      tags:
        - Movies
      summary: Create a new movie
      description: Creates a new movie with optional prerequisite IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieCreate'
      responses:
        "201":
          description: Movie created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        "400":
          description: Validation error or invalid prerequisite ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: runtime must be an integer between 1 and 300 minutes
                InvalidPrerequisite:
                  value:
                    error:
                      code: INVALID_PREREQUISITE
                      message: Prerequisite movie ID 99 does not exist
        "409":
          description: Duplicate title or circular dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DuplicateTitle:
                  value:
                    error:
                      code: DUPLICATE_TITLE
                      message: A movie with this title already exists
                CircularDependency:
                  value:
                    error:
                      code: CIRCULAR_DEPENDENCY
                      message: Setting this prerequisite would create a cyclic dependency
  /movies/{id}:
    get:
      tags:
        - Movies
      summary: Get movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Movie details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Movies
      summary: Update movie or replace prerequisites
      description: Updates movie attributes. If prerequisites array is supplied, it replaces the entire prerequisite list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoviePatch'
      responses:
        "200":
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        "400":
          description: Validation error or invalid prerequisite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: releaseYear must be an integer between 1888 and 2100
                InvalidPrerequisite:
                  value:
                    error:
                      code: INVALID_PREREQUISITE
                      message: Prerequisite movie ID 99 does not exist
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Duplicate title or circular dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CircularDependency:
                  value:
                    error:
                      code: CIRCULAR_DEPENDENCY
                      message: Setting this prerequisite would create a cyclic dependency
                DuplicateTitle:
                  value:
                    error:
                      code: DUPLICATE_TITLE
                      message: A movie with this title already exists
  /movies/{id}/rewatch-order:
    get:
      tags:
        - Movies
      summary: Get MCU rewatch order for a target movie
      description: Returns all transitive prerequisites topologically ordered, excluding target movie, with total count, watched count, and remaining runtime.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 8
      responses:
        "200":
          description: Rewatch plan calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewatchOrderResponse'
        "404":
          $ref: '#/components/responses/NotFound'
  /cinemas:
    get:
      tags:
        - Cinemas
      summary: List all cinemas
      description: Returns an array of all registered cinemas with their available bundle sizes.
      responses:
        "200":
          description: List of cinemas retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cinema'
    post:
      tags:
        - Cinemas
      summary: Register a new cinema
      description: Creates a cinema with 1-10 distinct bundle sizes (each between 1 and 500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CinemaCreate'
      responses:
        "201":
          description: Cinema created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cinema'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: bundleSizes must be an array of 1 to 10 integers
        "409":
          description: Duplicate cinema name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DUPLICATE_NAME
                  message: A cinema with this name already exists
  /cinemas/{id}/booking:
    get:
      tags:
        - Cinemas
      summary: Calculate optimal seat bundle quote
      description: Returns the minimum number of seat bundles summing exactly to groupSize, or reports impossible.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: groupSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          example: 11
      responses:
        "200":
          description: Seat bundle quote calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                PossibleQuote:
                  summary: Exact seating possible
                  value:
                    cinema:
                      id: 1
                      name: Stark Odeon
                    groupSize: 11
                    possible: true
                    totalBundles: 4
                    bundles:
                      - size: 5
                        count: 1
                      - size: 2
                        count: 3
                ImpossibleQuote:
                  summary: Exact seating impossible
                  value:
                    cinema:
                      id: 1
                      name: Stark Odeon
                    groupSize: 7
                    possible: false
        "400":
          description: Invalid group size or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: groupSize must be an integer between 1 and 10000
        "404":
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Resource not found
    Movie:
      type: object
      required:
        - id
        - title
        - releaseYear
        - runtime
        - watched
        - prerequisites
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Iron Man
        releaseYear:
          type: integer
          minimum: 1888
          maximum: 2100
          example: 2008
        runtime:
          type: integer
          minimum: 1
          maximum: 300
          example: 126
        watched:
          type: boolean
          example: false
        prerequisites:
          type: array
          items:
            type: integer
          example: []
    MovieCreate:
      type: object
      required:
        - title
        - releaseYear
        - runtime
      properties:
        title:
          type: string
          example: The Avengers
        releaseYear:
          type: integer
          example: 2012
        runtime:
          type: integer
          example: 143
        watched:
          type: boolean
          default: false
          example: false
        prerequisites:
          type: array
          items:
            type: integer
          example: [1, 2]
    MoviePatch:
      type: object
      properties:
        title:
          type: string
          example: The Avengers (Extended)
        releaseYear:
          type: integer
          example: 2012
        runtime:
          type: integer
          example: 145
        watched:
          type: boolean
          example: true
        prerequisites:
          type: array
          items:
            type: integer
          example: [1]
    RewatchOrderResponse:
      type: object
      required:
        - target
        - order
        - total
        - watchedCount
        - remainingRuntime
      properties:
        target:
          type: object
          required:
            - id
            - title
          properties:
            id:
              type: integer
              example: 8
            title:
              type: string
              example: "Avengers: Doomsday"
        order:
          type: array
          items:
            $ref: '#/components/schemas/Movie'
        total:
          type: integer
          example: 7
        watchedCount:
          type: integer
          example: 4
        remainingRuntime:
          type: integer
          example: 390
    Cinema:
      type: object
      required:
        - id
        - name
        - bundleSizes
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Stark Odeon
        bundleSizes:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 500
          minItems: 1
          maxItems: 10
          example: [2, 5]
    CinemaCreate:
      type: object
      required:
        - name
        - bundleSizes
      properties:
        name:
          type: string
          example: Stark Odeon
        bundleSizes:
          type: array
          items:
            type: integer
          example: [2, 5]
    BundleCount:
      type: object
      required:
        - size
        - count
      properties:
        size:
          type: integer
          example: 5
        count:
          type: integer
          example: 1
    BookingResponse:
      type: object
      required:
        - cinema
        - groupSize
        - possible
      properties:
        cinema:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Stark Odeon
        groupSize:
          type: integer
          example: 11
        possible:
          type: boolean
          example: true
        totalBundles:
          type: integer
          example: 4
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/BundleCount'
          example:
            - size: 5
              count: 1
            - size: 2
              count: 3
  responses:
    ValidationError:
      description: Invalid payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: runtime must be an integer between 1 and 300
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Movie with specified id was not found
    Conflict:
      description: Conflict such as circular dependency or duplicate name/title
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            CircularDependency:
              value:
                error:
                  code: CIRCULAR_DEPENDENCY
                  message: Setting this prerequisite would create a cyclic dependency
            DuplicateTitle:
              value:
                error:
                  code: DUPLICATE_TITLE
                  message: A movie with this title already exists
